openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: sync
    description: Authenticated cross-device synchronization operations
  - name: storage
    description: Persistent user-uploaded media
  - name: premium
    description: Premium subscription request operations
  - name: admin
    description: Superadmin-only account role administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Send a password reset code
      description: Sends a short-lived, single-use password reset code by email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
      responses:
        "202":
          description: Reset request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResponse"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Email delivery is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Confirm a password reset
      description: Validates a reset code and atomically consumes it before saving the new password hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmInput"
      responses:
        "200":
          description: Password reset completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetConfirmResponse"
        "400":
          description: Invalid request or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid, expired, or already used code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Verify a server-stored password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Authenticated session and user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionPayload"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/register:
    post:
      operationId: authRegister
      tags: [auth]
      summary: Register an account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionPayload"
        "400":
          description: Invalid registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email or username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/session:
    get:
      operationId: authSession
      tags: [auth]
      summary: Restore a server-verified session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserPayload"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: authLogout
      tags: [auth]
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked
  /auth/profile:
    patch:
      operationId: authUpdateProfile
      tags: [auth]
      summary: Update the authenticated profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthProfileUpdateInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserPayload"
        "400":
          description: Invalid profile values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/sessions:
    get:
      operationId: listAuthSessions
      tags: [auth]
      summary: List the authenticated user's active sessions
      description: Lists only sessions that are unexpired and still match the current password credential. Token hashes are never returned.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active authenticated sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionListResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/sessions/others:
    delete:
      operationId: revokeOtherAuthSessions
      tags: [auth]
      summary: Revoke all other sessions
      description: Revokes every session owned by the authenticated user except the current session.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Other sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionRevokeOthersResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeAuthSession
      tags: [auth]
      summary: Revoke one owned session
      description: Revokes a session only when it belongs to the authenticated user. Revoking the current session is allowed and invalidates its bearer token.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Selected session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionRevokeResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Session not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password:
    put:
      operationId: authChangePassword
      tags: [auth]
      summary: Change the authenticated password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthChangePasswordInput"
      responses:
        "200":
          description: Password changed and replacement session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionPayload"
        "400":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Current password or session invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/google:
    post:
      operationId: authGoogle
      tags: [auth]
      summary: Sign in to an existing account with Google
      description: Verifies a Google ID token and allows access only when its verified email belongs to an existing LAZLANI password account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthGoogleInput"
      responses:
        "200":
          description: Google identity verified and matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionPayload"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid Google identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No existing LAZLANI account for the verified email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Google authentication is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /premium-requests:
    post:
      operationId: createPremiumRequest
      tags: [premium]
      summary: Create a premium subscription request
      description: Creates a request for the server-defined monthly price of 100 TRY. The client cannot set the price.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PremiumRequestCreateInput"
      responses:
        "201":
          description: Premium request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PremiumRequestResponse"
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A pending request already exists for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listPremiumRequests
      tags: [premium]
      summary: List the authenticated user's premium requests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Premium requests belonging to the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PremiumRequestListResponse"
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /premium-requests/{requestId}:
    get:
      operationId: getPremiumRequest
      tags: [premium]
      summary: Get one of the authenticated user's premium requests
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Premium request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PremiumRequestResponse"
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/premium-requests:
    get:
      operationId: listAdminPremiumRequests
      tags: [premium]
      summary: List all premium requests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All premium requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PremiumRequestListResponse"
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List authenticated users and their server-controlled roles
      description: Lists real auth users. Only a superadmin may access this endpoint.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Auth users and roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Superadmin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/users/{userId}/role:
    patch:
      operationId: updateAdminUserRole
      tags: [admin]
      summary: Set a user's regular admin role
      description: Sets only user or admin. Superadmin changes are reserved for the controlled bootstrap CLI.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserRoleUpdateInput"
      responses:
        "200":
          description: Updated user role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserRoleUpdateResponse"
        "400":
          description: Invalid role or unsafe target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Superadmin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Target is a superadmin and can only be changed by bootstrap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/premium-requests/{requestId}/approve:
    post:
      operationId: approvePremiumRequest
      tags: [premium]
      summary: Approve a pending premium request
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Request approved and user entitlement granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PremiumRequestResponse"
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/premium-requests/{requestId}/reject:
    post:
      operationId: rejectPremiumRequest
      tags: [premium]
      summary: Reject a pending premium request
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Request rejected without granting premium entitlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PremiumRequestResponse"
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sync/snapshot:
    get:
      operationId: getSyncSnapshot
      tags: [sync]
      summary: Read the authenticated user's current sync snapshot
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Current records and the event cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncSnapshot"
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sync/operations:
    post:
      operationId: submitSyncOperation
      tags: [sync]
      summary: Submit an idempotent synchronization operation
      description: The authenticated session is the actor. clientOperationId is scoped to that authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncOperationInput"
      responses:
        "200":
          description: Canonical event and snapshot record, including a prior result for a duplicate operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOperationResult"
        "400":
          description: Invalid operation or unauthorized private target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sync/events:
    get:
      operationId: streamSyncEvents
      tags: [sync]
      summary: Stream committed synchronization events
      description: SSE stream with persistent replay. Send Last-Event-ID or cursor to resume.
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Server-sent events
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a protected upload URL for a book cover, post photo, or DM photo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid file metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /storage/uploads/finalize:
    post:
      operationId: finalizeUpload
      tags: [storage]
      summary: Verify and finalize a staged social media image
      description: Verifies the stored object's metadata and image signature, then promotes it into the requested protected namespace.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeUploadRequest"
      responses:
        "200":
          description: Upload finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeUploadResult"
        "400":
          description: Invalid or unverifiable uploaded object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Staged object belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Staged object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve a persistent social media image
      description: Book covers are public. Post photos follow post visibility and DM photos are limited to message audience members.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
            pattern: "^(book-covers|social-posts|dm-photos)/"
      responses:
        "200":
          description: Stored image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required for private media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not in the media audience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteStorageObject
      tags: [storage]
      summary: Delete an owned finalized book cover
      security:
        - bearerAuth: []
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
            pattern: "^(book-covers|social-posts|dm-photos)/"
      responses:
        "204":
          description: Object deleted
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Object belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
    UploadUrlRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 180
        size:
          type: integer
          minimum: 1
          maximum: 10485760
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        namespace:
          type: string
          enum: [book-covers, social-posts, dm-photos]
          default: book-covers
          description: Protected object namespace.
      required: [name, size, contentType]
    UploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
          pattern: "^/objects/uploads/(book-covers|social-posts|dm-photos)/"
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
      required: [uploadURL, objectPath, metadata]
    FinalizeUploadRequest:
      type: object
      properties:
        objectPath:
          type: string
          pattern: "^/objects/uploads/(book-covers|social-posts|dm-photos)/"
        size:
          type: integer
          minimum: 1
          maximum: 10485760
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
      required: [objectPath]
    FinalizeUploadResult:
      type: object
      properties:
        objectPath:
          type: string
          pattern: "^/objects/(book-covers|social-posts|dm-photos)/"
      required: [objectPath]
    PasswordResetRequestInput:
      type: object
      properties:
        email:
          type: string
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
      required:
        - email
    PasswordResetRequestResponse:
      type: object
      properties:
        message:
          type: string
        expiresInSeconds:
          type: integer
      required:
        - message
        - expiresInSeconds
    PasswordResetConfirmInput:
      type: object
      properties:
        email:
          type: string
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
        code:
          type: string
          pattern: "^[0-9]{6}$"
        newPassword:
          type: string
          minLength: 8
      required:
        - email
        - code
        - newPassword
