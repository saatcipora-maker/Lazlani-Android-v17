          $ref: "#/components/schemas/SyncEntityType"
        payload:
          type: object
          additionalProperties: true
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
      required: [id, entityType, payload, version, updatedAt]
    SyncSnapshot:
      type: object
      properties:
        cursor: { type: integer }
        records:
          type: array
          items:
            $ref: "#/components/schemas/SyncRecord"
      required: [cursor, records]
    SyncOperationResult:
      type: object
      properties:
        clientOperationId: { type: string }
        duplicate: { type: boolean }
        event:
          $ref: "#/components/schemas/SyncEvent"
        record:
          $ref: "#/components/schemas/SyncRecord"
      required: [clientOperationId, duplicate, event, record]