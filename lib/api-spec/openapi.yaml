    SyncOperationType:
      type: string
      enum:
        - create_message
        - delete_message
        - create_notification
        - create_comment
        - delete_comment
        - create_reply
        - create_ozel_comment
        - create_ozel_reply
        - upsert_ozel_video
        - toggle_like
        - set_reaction
        - toggle_vote
        - create_book
        - update_book
        - delete_book
        - create_post
        - update_post
        - delete_post
        - start_reading
    SyncEntityType:
      type: string
      enum:
        - message
        - notification
        - comment
        - reply
        - ozel_comment
        - ozel_reply
        - ozel_video
        - like
        - reaction
        - vote
        - book
        - post
        - reading
    SyncOperationInput:
      type: object
      properties:
        clientOperationId:
          type: string
          minLength: 1
          maxLength: 200
        operationType:
          $ref: "#/components/schemas/SyncOperationType"
        payload:
          $ref: "#/components/schemas/SyncOperationPayload"
      required: [clientOperationId, operationType, payload]
    SyncOperationPayload:
      type: object
      description: Typed common operation fields. rating is required by toggle_vote and is always an integer from 1 through 5.
      properties:
        id: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        parentId: { type: string }
        recipientUserId: { type: string }
        authorUserId: { type: string }
        media:
          type: object
          additionalProperties: true
          description: Photo/media metadata. Access is enforced by the containing record audience.
        photo:
          type: object
          additionalProperties: true
          description: Optional photo metadata for a post or direct message.
        coverUrl: { type: string }
        title: { type: string }
        coverColor: { type: string }
        authorId: { type: string }
        authorName: { type: string }
        authorAvatarColor: { type: string }
        description: { type: string }
        genre: { type: string }
        chapters:
          type: array
          items:
            type: object
            additionalProperties: true
        likesCount: { type: integer }
        commentsCount: { type: integer }
        readCount: { type: integer }
        isFeatured: { type: boolean }
        isEditorChoice: { type: boolean }
        isDraft: { type: boolean }
        createdAt: { type: string }
        tags:
          type: array
          items: { type: string }
        active: { type: boolean }
        value: { type: string }
        rating:
          type: integer
          minimum: 0
          maximum: 5
        activeCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Authoritative count of active likes or reactions for the target.
        valueCounts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          readOnly: true
          description: Authoritative active count by reaction value.
        ratingCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Authoritative count of active ratings for the target.
        ratingAverage:
          type: number
          minimum: 0
          maximum: 5
          readOnly: true
          description: Authoritative average of all active ratings for the target.
        aggregateCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Absolute aggregate value for unique reading starts.
        absoluteCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Alias of aggregateCount for mobile projections.
        aggregateRevision:
          type: integer
          minimum: 1
          readOnly: true
          description: Monotonic event id for aggregate convergence.
        aggregateType:
          type: string
          enum: [absolute]
          readOnly: true
        aggregateValue:
          type: integer
          minimum: 0
          readOnly: true
      additionalProperties: true
    SyncEvent:
      type: object
      properties:
        id: { type: integer }
        entityType:
          $ref: "#/components/schemas/SyncEntityType"
        entityId: { type: string }
        payload:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
      required: [id, entityType, entityId, payload, createdAt]
    SyncRecord:
      type: object
      properties:
        id: { type: string }
