openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Afilli kitap, dergi ve okur topluluğu API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: app
    description: Ana sayfa ve arama
  - name: books
    description: Kitaplar ve okuma ilerlemesi
  - name: posts
    description: Bültenler, dergi yazıları ve yorumlar
  - name: profiles
    description: Okur profilleri ve takip
  - name: notifications
    description: Bildirimler
  - name: store
    description: Shopify ürünleri ve ödeme
  - name: community
    description: Mesajlar ve tanıtım
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /app/bootstrap:
    get:
      operationId: getAppBootstrap
      tags: [app]
      summary: Ana ekran ve kitaplık verilerini getir
      responses:
        "200":
          description: Uygulama ana verileri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppBootstrap"
  /search:
    get:
      operationId: searchApp
      tags: [app]
      summary: Kitap, yazar ve kullanıcı ara
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200":
          description: Arama sonuçları
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
  /books:
    get:
      operationId: listBooks
      tags: [books]
      summary: Kitapları listele
      responses:
        "200":
          description: Kitap listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Book" }
    post:
      operationId: createBook
      tags: [books]
      summary: Kitap veya taslak oluştur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookInput" }
      responses:
        "201":
          description: Kaydedilen kitap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "401": { description: Oturum açılması gerekiyor }
  /books/mine:
    get:
      operationId: listMyBooks
      tags: [books]
      summary: Kullanıcının kitaplarını ve taslaklarını getir
      responses:
        "200":
          description: Kullanıcı kitapları
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Book" }
        "401": { description: Oturum açılması gerekiyor }
  /books/{bookId}:
    get:
      operationId: getBook
      tags: [books]
      summary: Kitap detayını getir
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Kitap detayı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "404": { description: Kitap bulunamadı }
    patch:
      operationId: updateBook
      tags: [books]
      summary: Kitap taslağını düzenle veya yayımla
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookInput" }
      responses:
        "200":
          description: Güncellenmiş kitap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "401": { description: Oturum açılması gerekiyor }
        "404": { description: Kitap bulunamadı }
  /books/{bookId}/like:
    post:
      operationId: toggleBookLike
      tags: [books]
      summary: Kitabı beğen veya beğeniyi kaldır
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Güncel beğeni durumu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InteractionResult" }
  /books/{bookId}/save:
    post:
      operationId: toggleBookSave
      tags: [books]
      summary: Kitabı kaydet veya kayıttan çıkar
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Güncel kaydetme durumu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InteractionResult" }
  /books/{bookId}/progress:
    patch:
      operationId: updateBookProgress
      tags: [books]
      summary: Okuma ilerlemesini güncelle
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookProgressInput" }
      responses:
        "200":
          description: Güncel okuma ilerlemesi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InteractionResult" }
  /books/{bookId}/comments:
    get:
      operationId: getBookComments
      tags: [books]
      summary: Kitap yorumlarını getir
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Yorumlar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
    post:
      operationId: addBookComment
      tags: [books]
      summary: Kitaba yorum ekle
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentInput" }
      responses:
        "201":
          description: Oluşturulan yorum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: Bülten ve yazı akışını getir
      parameters:
        - name: authorId
          in: query
          required: false
          schema: { type: string }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [newsletter, magazine, book-review, photo] }
      responses:
        "200":
          description: Akış gönderileri
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Post" }
    post:
      operationId: createPost
      tags: [posts]
      summary: Bülten veya dergi yazısı yayınla
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostInput" }
      responses:
        "201":
          description: Yayınlanan gönderi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "403": { description: Bu içerik için abonelik gerekiyor }
  /posts/{postId}/like:
    post:
      operationId: togglePostLike
      tags: [posts]
      summary: Gönderiyi beğen veya beğeniyi kaldır
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Güncel beğeni durumu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InteractionResult" }
  /posts/{postId}/comments:
    get:
      operationId: getPostComments
      tags: [posts]
      summary: Gönderi yorumlarını getir
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Yorumlar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
    post:
      operationId: addPostComment
      tags: [posts]
      summary: Gönderiye yorum ekle
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentInput" }
      responses:
        "201":
          description: Oluşturulan yorum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Bildirimleri getir
      responses:
        "200":
          description: Bildirim listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Bildirimi okundu olarak işaretle
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Okunma durumu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InteractionResult" }
  /profiles/{profileId}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Profil detayını getir
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Profil bilgileri
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
  /profiles/me:
    patch:
      operationId: updateMyProfile
      tags: [profiles]
      summary: Profil bilgilerini güncelle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Güncellenmiş profil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { description: Oturum açılması gerekiyor }
  /profiles/{profileId}/follow:
    post:
      operationId: toggleFollow
      tags: [profiles]
      summary: Kullanıcıyı takip et veya takibi bırak
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Güncel takip durumu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InteractionResult" }
  /profiles/{profileId}/connections/{type}:
    get:
      operationId: getProfileConnections
      tags: [profiles]
      summary: Takipçi veya takip edilenleri getir
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string }
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [followers, following] }
      responses:
        "200":
          description: Profil listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Profile" }
  /store/products:
    get:
      operationId: listStoreProducts
      tags: [store]
      summary: Shopify ürünlerini getir
      responses:
        "200":
          description: Shopify kataloğu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreProductsResponse" }
    post:
      operationId: createStoreProduct
      tags: [store]
      summary: Shopify mağazasında ürün oluştur
      description: |
        Aynı sahip ve doğrulanmış ürün bilgileri kalıcı olarak tek işlem sayılır.
        Tamamlanan isteğin tekrarı kayıtlı sonucu döndürür. Yarım veya sonucu
        belirsiz işlem tekrar çalıştırılmaz; 409 ve Shopify'da elle kurtarma
        bilgisi döner. Hata sonrası bilgileri değiştirip yeniden eklemeyin.
        Otomatik silme yapılmaz; yayınlama en son aşamadır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreProductInput" }
      responses:
        "201":
          description: Oluşturulan ürün
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreProduct" }
        "409":
          description: Önceki işlem sürüyor veya Shopify'da elle kontrol edilmeli
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreProductRecovery" }
        "502":
          description: İşlem belirtilen aşamada durdu; otomatik yeniden oluşturulmaz
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreProductRecovery" }
  /store/checkout:
    post:
      operationId: createStoreCheckout
      tags: [store]
      summary: Shopify ödeme bağlantısı oluştur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "200":
          description: Shopify barındırmalı ödeme bağlantısı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResponse" }
  /memberships:
    get:
      operationId: getMemberships
      tags: [store]
      summary: Abonelik durumlarını getir
      responses:
        "200":
          description: Abonelik yapılandırma durumu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipStatus" }
  /messages:
    get:
      operationId: listMessages
      tags: [community]
      summary: Mesajları getir
      responses:
        "200":
          description: Mesaj listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
    post:
      operationId: sendMessage
      tags: [community]
      summary: Mesaj gönder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Gönderilen mesaj
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /chat/rooms/{roomId}/photos:
    post:
      operationId: requestChatPhotoUpload
      tags: [community]
      summary: Depolama tarafında boyutu sınırlı fotoğraf yükleme oturumu
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string, enum: [general, afilli, magazin, serbest] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatPhotoInput" }
      responses:
        "200":
          description: Dosyayı doğrudan PUT ile yükleyip beş dakika içinde uploadId ile mesaj gönderin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatPhotoUpload" }
        "400": { description: Geçersiz dosya türü veya boyutu }
        "401": { description: Oturum gerekli }
        "403": { description: Hesap engelli }
        "429": { description: Günlük kota veya bekleyen yükleme sınırı }
  /chat/photos/{uploadId}:
    delete:
      operationId: cancelChatPhotoUpload
      tags: [community]
      parameters:
        - name: uploadId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Yükleme iptal edildi veya zaten tamamlandı }
        "401": { description: Oturum gerekli }
        "403": { description: Hesap engelli }
  /chat/rooms/{roomId}/photos/{messageId}:
    get:
      operationId: getChatPhoto
      tags: [community]
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string, enum: [general, afilli, magazin, serbest] }
        - name: messageId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Yetkili oda fotoğrafı
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        "401": { description: Oturum gerekli }
        "403": { description: Hesap engelli }
        "404": { description: Fotoğraf yok veya erişim engelli }
  /chat/rooms/{roomId}/messages:
    parameters:
      - name: roomId
        in: path
        required: true
        schema: { type: string, enum: [general, afilli, magazin, serbest] }
    get:
      operationId: listRoomMessages
      tags: [community]
      summary: Sohbet odası mesajlarını getir
      responses:
        "200":
          description: Oda mesajları
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatMessage" }
    post:
      operationId: sendRoomMessage
      tags: [community]
      summary: Sohbet odasına mesaj gönder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMessageInput" }
      responses:
        "201":
          description: Gönderilen mesaj
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "400": { description: Geçersiz mesaj veya fotoğraf }
        "401": { description: Oturum gerekli }
        "403": { description: Hesap engelli }
        "429": { description: Günlük beş fotoğraf kotası dolu }
  /chat/bootstrap:
    get:
      operationId: getChatBootstrap
      tags: [community]
      responses:
        "200":
          description: Sohbet ayarları ve kullanıcılar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatBootstrap" }
  /chat/blocks/{profileId}:
    parameters:
      - { name: profileId, in: path, required: true, schema: { type: string } }
    put:
      operationId: setChatBlock
      tags: [community]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockInput" }
      responses:
        "200":
          description: Engelleme durumu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InteractionResult" }
  /chat/admin/users:
    get:
      operationId: listChatAdminUsers
      tags: [community]
      responses:
        "200":
          description: Yönetici kullanıcı listesi
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatUser" } }
  /chat/admin/users/{profileId}:
    parameters:
      - { name: profileId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: setChatUserStatus
      tags: [community]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockInput" }
      responses:
        "200":
          description: Güncellenen kullanıcı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatUser" }
  /chat/admin/rooms/{roomId}:
    parameters:
      - { name: roomId, in: path, required: true, schema: { type: string, enum: [general, afilli, magazin, serbest] } }
    patch:
      operationId: setChatRoomPolicy
      tags: [community]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomPolicyInput" }
      responses:
        "200":
          description: Oda ayarı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatRoom" }
  /chat/admin/gifs:
    post:
      operationId: addChatGifs
      tags: [community]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GifBatchInput" }
      responses:
        "201":
          description: Yüklenen GIF arşivi
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatGif" } }
  /chat/admin/gifs/{gifId}:
    parameters:
      - { name: gifId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteChatGif
      tags: [community]
      responses:
        "200":
          description: Kaldırma sonucu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InteractionResult" }
  /messages/read:
    post:
      operationId: readConversation
      tags: [community]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationReadInput" }
      responses:
        "200":
          description: Mesajlar okundu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InteractionResult" }
  /book-ads:
    post:
      operationId: createBookAd
      tags: [community]
      summary: Kitap tanıtım talebi oluştur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookAdInput" }
      responses:
        "201":
          description: Tanıtım talebi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookAd" }
  /content/uploads:
    post:
      operationId: beginContentUpload
      tags: [community]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContentUploadInput" } } } }
      responses:
        "201": { description: Upload allocation, content: { application/json: { schema: { $ref: "#/components/schemas/ContentUpload" } } } }
  /content/uploads/{mediaId}:
    parameters: [{ name: mediaId, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: discardContentUpload
      tags: [community]
      responses: { "204": { description: Unused upload discarded } }
  /content/uploads/{mediaId}/complete:
    parameters: [{ name: mediaId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: completeContentUpload
      tags: [community]
      responses:
        "200": { description: Verified upload, content: { application/json: { schema: { $ref: "#/components/schemas/ContentMedia" } } } }
  /content/media/{mediaId}/url:
    parameters: [{ name: mediaId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getContentMediaUrl
      tags: [community]
      responses:
        "200": { description: Short-lived media URL, content: { application/json: { schema: { $ref: "#/components/schemas/ContentMediaUrl" } } } }
  /content/stories:
    get:
      operationId: listStories
      tags: [community]
      responses:
        "200": { description: Active stories, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ContentStory" } } } } }
    post:
      operationId: createStory
      tags: [community]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContentStoryInput" } } } }
      responses:
        "201": { description: Story created, content: { application/json: { schema: { $ref: "#/components/schemas/ContentStory" } } } }
  /content/stories/{storyId}:
    parameters: [{ name: storyId, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: deleteStory
      tags: [community]
      responses: { "204": { description: Story deleted } }
  /content/stories/{storyId}/view:
    parameters: [{ name: storyId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: viewStory
      tags: [community]
      responses: { "204": { description: Story seen } }
  /content/videos:
    get:
      operationId: listSpecialVideos
      tags: [community]
      responses:
        "200": { description: Special video feed, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SpecialVideo" } } } } }
    post:
      operationId: createSpecialVideo
      tags: [community]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SpecialVideoInput" } } } }
      responses:
        "201": { description: Video published, content: { application/json: { schema: { $ref: "#/components/schemas/SpecialVideo" } } } }
  /content/videos/{videoId}:
    parameters: [{ name: videoId, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: deleteSpecialVideo
      tags: [community]
      responses: { "204": { description: Video deleted } }
  /content/videos/{videoId}/like:
    parameters: [{ name: videoId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: likeSpecialVideo
      tags: [community]
      responses:
        "200": { description: Reaction changed, content: { application/json: { schema: { $ref: "#/components/schemas/SpecialVideo" } } } }
  /content/videos/{videoId}/view:
    parameters: [{ name: videoId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: viewSpecialVideo
      tags: [community]
      responses: { "204": { description: View recorded } }
  /content/videos/{videoId}/comments:
    parameters: [{ name: videoId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listVideoComments
      tags: [community]
      responses:
        "200": { description: Comments, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ContentComment" } } } } }
    post:
      operationId: addVideoComment
      tags: [community]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContentCommentInput" } } } }
      responses:
        "201": { description: Comment created, content: { application/json: { schema: { $ref: "#/components/schemas/ContentComment" } } } }
  /content/comments/{commentId}:
    parameters: [{ name: commentId, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: deleteContentComment
      tags: [community]
      responses: { "204": { description: Comment deleted } }
  /content/posts/{postId}:
    parameters: [{ name: postId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getContentPost
      tags: [posts]
      responses:
        "200": { description: Full post, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
    patch:
      operationId: updateContentPost
      tags: [posts]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PostInput" } } } }
      responses:
        "200": { description: Updated post, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
    delete:
      operationId: deleteContentPost
      tags: [posts]
      responses: { "204": { description: Post deleted } }
  /content/books/{bookId}:
    parameters: [{ name: bookId, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: deleteContentBook
      tags: [books]
      responses: { "204": { description: Own book deleted } }
  /content/ads:
    get:
      operationId: listPromotionRequests
      tags: [community]
      responses:
        "200": { description: Own requests or admin queue, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PromotionRequest" } } } } }
  /content/ads/{adId}:
    parameters: [{ name: adId, in: path, required: true, schema: { type: string } }]
    patch:
      operationId: reviewPromotionRequest
      tags: [community]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PromotionReviewInput" } } } }
      responses:
        "200": { description: Request reviewed, content: { application/json: { schema: { $ref: "#/components/schemas/PromotionRequest" } } } }
components:
  schemas:
    ContentUploadInput:
      type: object
      required: [purpose, mime, size]
      properties:
        purpose: { type: string, enum: [post, story, video] }
        mime: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, video/quicktime, video/webm] }
        size: { type: integer, minimum: 1, maximum: 104857600 }
    ContentUpload:
      type: object
      required: [id, uploadUrl]
      properties:
        id: { type: string }
        uploadUrl: { type: string }
    ContentMedia:
      type: object
      required: [id, path]
      properties:
        id: { type: string }
        path: { type: string }
    ContentMediaUrl:
      type: object
      required: [url]
      properties:
        url: { type: string }
    ContentStoryInput:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 1000 }
        mediaId: { type: ["string", "null"] }
    ContentStory:
      type: object
      required: [id, authorId, author, avatarUrl, body, mediaId, seen, canManage, createdAt, expiresAt]
      properties:
        id: { type: string }
        authorId: { type: string }
        author: { type: string }
        avatarUrl: { type: ["string", "null"] }
        body: { type: string }
        mediaId: { type: ["string", "null"] }
        seen: { type: boolean }
        canManage: { type: boolean }
        createdAt: { type: string }
        expiresAt: { type: string }
    SpecialVideoInput:
      type: object
      required: [title, body, mediaId]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        body: { type: string, maxLength: 3000 }
        mediaId: { type: string }
    SpecialVideo:
      type: object
      required: [id, authorId, author, avatarUrl, title, body, mediaId, likes, views, comments, likedByMe, canManage, createdAt]
      properties:
        id: { type: string }
        authorId: { type: string }
        author: { type: string }
        avatarUrl: { type: ["string", "null"] }
        title: { type: string }
        body: { type: string }
        mediaId: { type: string }
        likes: { type: integer }
        views: { type: integer }
        comments: { type: integer }
        likedByMe: { type: boolean }
        canManage: { type: boolean }
        createdAt: { type: string }
    ContentCommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    ContentComment:
      type: object
      required: [id, authorId, author, avatarUrl, body, createdAt]
      properties:
        id: { type: string }
        authorId: { type: string }
        author: { type: string }
        avatarUrl: { type: ["string", "null"] }
        body: { type: string }
        createdAt: { type: string }
    PromotionReviewInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, rejected] }
    PromotionRequest:
      type: object
      required: [id, bookId, title, budget, status, canManage]
      properties:
        id: { type: string }
        bookId: { type: string }
        title: { type: string }
        budget: { type: integer }
        status: { type: string }
        canManage: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatMessage:
      type: object
      required: [id, roomId, senderId, sender, body, createdAt]
      properties:
        id: { type: string }
        roomId: { type: string }
        senderId: { type: string }
        sender: { type: string }
        body: { type: string }
        kind: { type: string, enum: [text, image, gif, book] }
        mediaUrl: { type: ["string", "null"] }
        bookId: { type: ["string", "null"] }
        bookTitle: { type: ["string", "null"] }
        bookCoverUrl: { type: ["string", "null"] }
        createdAt: { type: string }
    ChatPhotoInput:
      type: object
      required: [contentType, size]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, image/gif] }
        size: { type: integer, minimum: 1, maximum: 2250000 }
    ChatPhotoUpload:
      type: object
      required: [uploadId, uploadUrl]
      properties:
        uploadId: { type: string }
        uploadUrl: { type: string }
    ChatMessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 2000 }
        kind: { type: string, enum: [text, image, gif, book], default: text }
        uploadId: { type: ["string", "null"], maxLength: 100 }
        gifId: { type: ["string", "null"] }
        bookId: { type: ["string", "null"] }
    ChatRoom:
      type: object
      required: [id, title, description, allowGifs]
      properties:
        id: { type: string, enum: [general, afilli, magazin, serbest] }
        title: { type: string }
        description: { type: string }
        allowGifs: { type: boolean }
    ChatUser:
      type: object
      required: [id, name, handle, online, isBlocked]
      properties:
        id: { type: string }
        name: { type: string }
        handle: { type: string }
        avatarUrl: { type: ["string", "null"] }
        online: { type: boolean }
        isBlocked: { type: boolean }
    BlockInput:
      type: object
      required: [blocked]
      properties: { blocked: { type: boolean } }
    ChatGifInput:
      type: object
      required: [url, category]
      properties:
        url: { type: string, minLength: 1, maxLength: 3000000 }
        category: { type: string, minLength: 1, maxLength: 40 }
    RoomPolicyInput:
      type: object
      required: [allowGifs]
      properties: { allowGifs: { type: boolean } }
    GifBatchInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/ChatGifInput" }
    ConversationReadInput:
      type: object
      required: [profileId]
      properties: { profileId: { type: string } }
    ChatGif:
      allOf:
        - { $ref: "#/components/schemas/ChatGifInput" }
        - type: object
          required: [id]
          properties: { id: { type: string } }
    ChatBootstrap:
      type: object
      required: [rooms, gifs, users, blockedIds, photoCount, canManage]
      properties:
        rooms: { type: array, items: { $ref: "#/components/schemas/ChatRoom" } }
        gifs: { type: array, items: { $ref: "#/components/schemas/ChatGif" } }
        users: { type: array, items: { $ref: "#/components/schemas/ChatUser" } }
        blockedIds: { type: array, items: { type: string } }
        photoCount: { type: integer }
        canManage: { type: boolean }
    Book:
      type: object
      required: [id, title, author, category, description, content, reads, likes, comments, isPromoted, status, progress, likedByMe, savedByMe]
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        authorId: { type: ["string", "null"] }
        category: { type: string }
        description: { type: string }
        content: { type: string }
        coverUrl: { type: ["string", "null"] }
        coverTone: { type: string }
        reads: { type: integer }
        likes: { type: integer }
        comments: { type: integer }
        isPromoted: { type: boolean }
        status: { type: string, enum: [draft, published] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        likedByMe: { type: boolean }
        savedByMe: { type: boolean }
    BookInput:
      type: object
      required: [title, category, description, content, status]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 2000 }
        content: { type: string, maxLength: 100000 }
        coverUrl: { type: ["string", "null"], maxLength: 3000000 }
        status: { type: string, enum: [draft, published] }
    BookProgressInput:
      type: object
      required: [progress]
      properties:
        progress: { type: integer, minimum: 0, maximum: 100 }
    Post:
      type: object
      required: [id, author, handle, avatarUrl, type, title, body, likes, comments, views, likedByMe, allowLikes, allowComments, createdAt]
      properties:
        id: { type: string }
        authorId: { type: string }
        canManage: { type: boolean }
        author: { type: string }
        handle: { type: string }
        avatarUrl: { type: ["string", "null"] }
        type: { type: string, enum: [newsletter, magazine, book-review, photo] }
        title: { type: string }
        body: { type: string }
        imageUrl: { type: ["string", "null"] }
        bookId: { type: ["string", "null"] }
        likes: { type: integer }
        comments: { type: integer }
        views: { type: integer }
        likedByMe: { type: boolean }
        allowLikes: { type: boolean }
        allowComments: { type: boolean }
        createdAt: { type: string }
    PostInput:
      type: object
      required: [type, title, body, allowLikes, allowComments]
      properties:
        type: { type: string, enum: [newsletter, magazine, book-review, photo] }
        title: { type: string, maxLength: 160 }
        body: { type: string, maxLength: 20000 }
        imageUrl: { type: ["string", "null"], maxLength: 3000000 }
        bookId: { type: ["string", "null"] }
        allowLikes: { type: boolean }
        allowComments: { type: boolean }
    Profile:
      type: object
      required: [id, handle, name, followers, following, books, isFollowing, isCurrentUser]
      properties:
        id: { type: string }
        handle: { type: string }
        name: { type: string }
        avatarUrl: { type: ["string", "null"] }
        coverUrl: { type: ["string", "null"] }
        bio: { type: string }
        followers: { type: integer }
        following: { type: integer }
        books: { type: integer }
        isFollowing: { type: boolean }
        isCurrentUser: { type: boolean }
    ProfileInput:
      type: object
      required: [name, bio]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        bio: { type: string, maxLength: 500 }
        avatarUrl: { type: ["string", "null"], maxLength: 3000000 }
        coverUrl: { type: ["string", "null"], maxLength: 3000000 }
    Story:
      type: object
      required: [id, handle, name, seen]
      properties:
        id: { type: string }
        handle: { type: string }
        name: { type: string }
        avatarUrl: { type: ["string", "null"] }
        seen: { type: boolean }
    Notification:
      type: object
      required: [id, actorName, action, text, timeLabel, isRead]
      properties:
        id: { type: string }
        actorName: { type: string }
        actorAvatarUrl: { type: ["string", "null"] }
        action: { type: string, enum: [comment, like, save, follow] }
        text: { type: string }
        timeLabel: { type: string }
        relatedBookId: { type: ["string", "null"] }
        relatedProfileId: { type: ["string", "null"] }
        isRead: { type: boolean }
    Comment:
      type: object
      required: [id, author, body, createdAt]
      properties:
        id: { type: string }
        authorId: { type: string }
        author: { type: string }
        avatarUrl: { type: ["string", "null"] }
        body: { type: string }
        createdAt: { type: string }
    CommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    InteractionResult:
      type: object
      required: [active, count, value]
      properties:
        active: { type: boolean }
        count: { type: integer }
        value: { type: integer }
    SearchResults:
      type: object
      required: [books, profiles, posts]
      properties:
        books:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        profiles:
          type: array
          items: { $ref: "#/components/schemas/Profile" }
        posts:
          type: array
          items: { $ref: "#/components/schemas/Post" }
    AppBootstrap:
      type: object
      required: [profile, stories, featuredBooks, personalBooks, newBooks, recommendedBooks, readingBooks, savedBooks, posts, notifications, membership]
      properties:
        profile: { $ref: "#/components/schemas/Profile" }
        stories:
          type: array
          items: { $ref: "#/components/schemas/Story" }
        featuredBooks:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        personalBooks:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        newBooks:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        recommendedBooks:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        readingBooks:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        savedBooks:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        posts:
          type: array
          items: { $ref: "#/components/schemas/Post" }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        membership: { $ref: "#/components/schemas/MembershipStatus" }
    StoreProduct:
      type: object
      required: [id, title, description, price, currency, availableForSale]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        imageUrl: { type: ["string", "null"] }
        price: { type: number, minimum: 0 }
        currency: { type: string }
        variantId: { type: ["string", "null"] }
        availableForSale: { type: boolean }
        category: { type: string }
    StoreProductInput:
      type: object
      required: [title, description, price, quantity, category]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        price: { type: number, minimum: 0.01 }
        quantity: { type: integer, minimum: 0 }
        category: { type: string, enum: [Kitap, Defter, Kalem, Ajanda, Kitap Ayracı, Kalemlik] }
        imageUrl: { type: ["string", "null"], maxLength: 3000000 }
    StoreProductRecovery:
      type: object
      required: [error, stage, operationId, productId, recoveryRequired, visibility]
      properties:
        error: { type: string }
        stage: { type: string }
        operationId: { type: string }
        productId: { type: ["string", "null"] }
        recoveryRequired: { type: boolean }
        visibility:
          type: string
          enum: [unknown, not_published_by_this_operation]
    StoreProductsResponse:
      type: object
      required: [configured, canManage, currency, products, message]
      properties:
        configured: { type: boolean }
        canManage: { type: boolean }
        currency: { type: string }
        accountUrl: { type: string }
        products:
          type: array
          items: { $ref: "#/components/schemas/StoreProduct" }
        message: { type: string }
    CheckoutInput:
      type: object
      required: [variantId, quantity]
      properties:
        variantId: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1, maximum: 20 }
    CheckoutResponse:
      type: object
      required: [checkoutUrl]
      properties:
        checkoutUrl: { type: string }
    MembershipStatus:
      type: object
      required: [store, magazine, special, available, message]
      properties:
        store: { type: boolean }
        magazine: { type: boolean }
        special: { type: boolean }
        available: { type: boolean }
        message: { type: string }
    Message:
      type: object
      required: [id, sender, body, createdAt]
      properties:
        id: { type: string }
        sender: { type: string }
        senderId: { type: string }
        recipientId: { type: string }
        otherId: { type: string }
        avatarUrl: { type: ["string", "null"] }
        isRead: { type: boolean }
        recipient: { type: string }
        body: { type: string }
        createdAt: { type: string }
    MessageInput:
      type: object
      required: [recipient, body]
      properties:
        recipient: { type: string }
        body: { type: string, minLength: 1, maxLength: 2000 }
    BookAdInput:
      type: object
      required: [bookId, budget]
      properties:
        bookId: { type: string }
        budget: { type: number, minimum: 1, maximum: 100000000 }
    BookAd:
      type: object
      required: [id, bookId, budget, status]
      properties:
        id: { type: string }
        bookId: { type: string }
        budget: { type: number }
        status: { type: string }

